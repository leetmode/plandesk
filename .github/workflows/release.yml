# Builds the Windows installer and macOS disk images and attaches them to a
# GitHub Release. Runs when a version tag is pushed (git tag v0.2.1 && git push --tags),
# or by hand from the Actions tab.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # unsigned builds: no Apple / Windows code-signing certificate yet
      - run: npx electron-builder ${{ matrix.target }} --publish never --config.directories.output=release
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.dmg
          fail_on_unmatched_files: false
          generate_release_notes: true
